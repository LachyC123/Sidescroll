name: Deploy browser game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The game has no build step: game/ is self-contained ES modules plus its
      # normalised art and data. Publishing that directory as the site root is
      # the whole deployment.
      - name: Check the published tree is complete
        run: |
          set -e
          test -f game/index.html
          test -f game/src/main.js
          test -f game/data/asset_manifest.json
          test -f game/data/tilesets.json
          test -f game/data/props.json
          test -d game/assets/player
          biomes=$(find game/assets/env -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "biomes with art: $biomes"
          test "$biomes" -eq 15

      # Pages serves game/ as "/", so a path that resolves above it works
      # locally and 404s in production. This catches that before deploying.
      - name: Check game/ is self-contained
        run: node tools/check_selfcontained.mjs game

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
